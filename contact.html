<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Alexis Yoo</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="header-inner">
    <nav class="pages" aria-label="Site">
      <a href="index.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="eyebrow">Contact</p>
    <h1 style="font-size: 2.1rem;">Get in touch</h1>

    <p><a class="contact-email" href="mailto:alexisyoo94@gmail.com">alexisyoo94@gmail.com</a></p>

    <hr class="rule">

    <form action="https://formspree.io/f/xyeggadg" method="POST">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="_replyto" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button class="submit" type="submit">Send message</button>
    </form>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span>alexisyoo.com</span>
  </div>
</footer>

</html>
